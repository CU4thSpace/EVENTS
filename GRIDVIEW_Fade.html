<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920, height=1080"/>
  <link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
  <title>4thSpace Events Grid</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background: #111;
      color: #fff;
      font-family: "gill-sans-nova-condensed", sans-serif;
    }

    /* 4 columns x 3 rows = 12 events */
    #grid {
      box-sizing: border-box;
      width: 1920px;
      height: 1080px;
      padding: 30px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      border: 2px solid #444;
      background: #222;
    }

    .card img.bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .overlay {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .title {
      font-size: 38px;
      line-height: 1.05;
      margin-bottom: 10px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow-wrap: break-word;
    }

    .meta {
      font-size: 22px;
      line-height: 1.15;
      opacity: 0.9;
    }

    /* the italic description (h2) is hidden to keep the grid clean */
    .meta h2 { display: none; }

    .emoji-eye {
      display: inline-block;
      width: 1em;
      height: auto;
      max-width: 1em;
      max-height: 1em;
      vertical-align: middle;
      object-fit: contain;
    }
    .no-break-look { white-space: nowrap; display: inline-block; }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    const RSS_URL = "https://www.concordia.ca/content/concordia/en/next-gen/4th-space/programming/RSSCAL/_jcr_content/content-main/grid_container_671899525/grid-container-parsys/events_list_88801239.xml";
    const MAX_EVENTS = 12;
    const EYE = '<img src="https://raw.githubusercontent.com/CU4thSpace/EVENTS/refs/heads/main/emoji-eyes.png" alt="👀" class="emoji-eye">';

    function decodeEntities(str = "") {
      const txt = document.createElement("textarea");
      txt.innerHTML = str;
      return txt.value;
    }

    function processEmojiEyes(text) {
      return text
        .replace(/L👀k/g, '<span class="no-break-look">L' + EYE + 'k</span>')
        .replace(/L👀K/g, '<span class="no-break-look">L' + EYE + 'K</span>');
    }

    function extractImage(description) {
      const tmp = document.createElement("div");
      tmp.innerHTML = description;
      const img = tmp.querySelector("img");
      let src = "";
      if (img) { src = img.src; img.remove(); }
      return { src, html: decodeEntities(tmp.innerHTML) };
    }

    async function loadEvents() {
      try {
        const res = await fetch(`${RSS_URL}?t=${Date.now()}`, { cache: "no-store" });
        const xml = new DOMParser().parseFromString(await res.text(), "application/xml");
        const items = [...xml.querySelectorAll("item")].slice(0, MAX_EVENTS).map(item => ({
          title: decodeEntities(item.querySelector("title")?.textContent || "No title"),
          description: item.querySelector("description")?.textContent || ""
        }));
        render(items);
      } catch (err) {
        console.error("Error fetching RSS feed:", err);
        // keep whatever is already on screen; show a message only on first load
        const grid = document.getElementById("grid");
        if (!grid.children.length) grid.textContent = "Failed to load feed.";
      }
    }

    function render(items) {
      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      for (let i = 0; i < MAX_EVENTS; i++) {
        const card = document.createElement("div");
        card.className = "card";
        const item = items[i];

        if (item) {
          const { src, html } = extractImage(item.description);
          if (src) {
            const img = document.createElement("img");
            img.className = "bg";
            img.src = src;
            card.appendChild(img);
          }
          const overlay = document.createElement("div");
          overlay.className = "overlay";

          const title = document.createElement("div");
          title.className = "title";
          title.innerHTML = processEmojiEyes(item.title);

          const meta = document.createElement("div");
          meta.className = "meta";
          meta.innerHTML = html;

          overlay.appendChild(title);
          overlay.appendChild(meta);
          card.appendChild(overlay);
        }
        grid.appendChild(card);
      }
    }

    loadEvents();
    setInterval(loadEvents, 5 * 60 * 1000); // refresh every 5 minutes
  </script>
</body>
</html>
