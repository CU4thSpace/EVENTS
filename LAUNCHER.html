<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <title>4th Space LAUNCHER</title>
  <style>
    body {
      margin: 0;
      font-family: "gill-sans-nova-condensed", sans-serif;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255,255,255,0.04), rgba(255,255,255,0) 60%),
        linear-gradient(180deg, #2a301f 0%, #1d2216 100%);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 700px;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    h1 {
      color: #FFFFFF;
      font-weight: 700;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-size: clamp(24px, 4.5vw, 42px);
      margin: 0 0 24px 0;
      text-align: center;
    }

    /* ---- "Faceplate" wrapper: the avocado-green phone housing the keys sit in ---- */
    .faceplate {
      width: 100%;
      max-width: 560px;
      border-radius: 22px;
      padding: 34px 30px 40px;
      box-sizing: border-box;
      background:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.10), rgba(255,255,255,0) 55%),
        linear-gradient(155deg, #8a9a72 0%, #7c8c66 40%, #6f7d5a 100%);
      /* faint stipple texture like the phone's textured plastic */
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.10), rgba(255,255,255,0) 55%),
        linear-gradient(155deg, #8a9a72 0%, #7c8c66 40%, #6f7d5a 100%),
        repeating-radial-gradient(circle at 0 0, rgba(0,0,0,0.025) 0, rgba(0,0,0,0.025) 1px, transparent 1px, transparent 3px);
      box-shadow:
        inset 0 2px 2px rgba(255,255,255,0.25),
        inset 0 -10px 20px rgba(0,0,0,0.35),
        0 18px 40px rgba(0,0,0,0.55);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
    }

    /* ---- Name plate: the little recessed label slot below the keypad ---- */
    .nameplate {
      margin-top: 22px;
      width: 100%;
      height: 46px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;

      background: linear-gradient(180deg, #cfd0c4 0%, #b9baac 100%);
      box-shadow:
        inset 0 3px 5px rgba(0,0,0,0.45),
        inset 0 -1px 0 rgba(255,255,255,0.4),
        0 1px 0 rgba(255,255,255,0.08);
    }

    .nameplate span {
      font-family: "Special Elite", "Courier New", monospace;
      text-transform: none;
      font-size: clamp(14px, 2.6vw, 20px);
      letter-spacing: 0.06em;
      color: #2b2b26;
      opacity: 0.85;
    }

    /* ---- Keycap styling ---- */
    .nav-button {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      text-decoration: none;
      font-family: "gill-sans-nova-condensed", sans-serif;
      font-weight: 700;
      font-size: clamp(11px, 1.7vw, 14px);
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-align: center;
      line-height: 1.15;
      aspect-ratio: 1 / 1;
      border-radius: 9px;
      padding: 6px 4px;
      box-sizing: border-box;
      color: #f2f2ef;

      /* dark keycap body with a soft dome highlight, like the molded plastic keys */
      background-image:
        radial-gradient(ellipse at 32% 22%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.06) 30%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #3a3a3a 0%, #2b2b2b 55%, #202020 100%);

      /* raised keycap shadow: bright top bevel, dark bottom bevel, drop shadow onto faceplate */
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -3px 3px rgba(0,0,0,0.55),
        0 4px 0 rgba(0,0,0,0.45),
        0 7px 10px rgba(0,0,0,0.45);

      transform: translateY(0);
      transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
    }

    .nav-button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    .nav-button:active,
    .nav-button.pressed {
      transform: translateY(3px);
      filter: brightness(0.9);
      box-shadow:
        inset 0 2px 4px rgba(0,0,0,0.6),
        inset 0 -1px 0 rgba(255,255,255,0.1),
        0 1px 0 rgba(0,0,0,0.4),
        0 2px 4px rgba(0,0,0,0.4);
    }

    .nav-button.focused {
      outline: 3px solid #FFD600;
      outline-offset: 3px;
      transform: translateY(-1px);
      z-index: 2;
    }

    .nav-button.focused.pressed,
    .nav-button.focused:active {
      transform: translateY(3px);
    }

    /* the light-colored keys (white/yellow originals) get a darker text + lighter dome */
    .nav-button.key-light {
      background-image:
        radial-gradient(ellipse at 32% 22%, rgba(255,255,255,0.55) 0%, rgba(255,255,255,0.15) 30%, rgba(255,255,255,0) 55%),
        linear-gradient(180deg, #d9d6c9 0%, #c7c3b3 55%, #b6b2a0 100%);
      color: #1c1c1c;
    }

    .corner-num {
      position: absolute;
      top: 5px;
      left: 7px;
      font-size: clamp(9px, 1.4vw, 12px);
      font-weight: 700;
      opacity: 0.55;
      line-height: 1;
    }

    .label {
      pointer-events: none;
    }

    #focusTrap {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 1px;
      height: 1px;
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TODAY SOMETHING HAPPENS</h1>
    <div class="faceplate">
      <div class="grid" id="grid"></div>
      <div class="nameplate"><span>TODAY SOMETHING HAPPENS</span></div>
    </div>
  </div>

  <input id="focusTrap" type="text" autocomplete="off" />

  <script>
    // Title / URL pairs (1-9, numpad style)
    const links = [
      { title: "TODAY OBS",      url: "https://cu4thspace.github.io/EVENTS/OBSCLOCKDATE" },
      { title: "SHAREPOINT 4SP",  url: "https://liveconcordia.sharepoint.com/teams/4thSPACE" },
      { title: "4thSpace Website",   url: "https://www.concordia.ca/next-gen/4th-space.html" },
      { title: "YouTube",     url: "https://www.youtube.com/CU4thSpace" },
      { title: "Go LIVE",       url: "https://studio.youtube.com/channel/UCEOJMoIqrd5vJDPIWZz7s_Q/livestreaming/dashboard" },
      { title: "PLANNER",        url: "https://planner.cloud.microsoft/webui/myplans/recent?tid=5569f185-d22f-4e13-9850-ce5b1abcd2e8" },
      { title: "INTROS!",      url: "https://liveconcordia.sharepoint.com/:f:/t/4thSPACE/IgDTu4z8xikmRZQzK06SPa0oAVkCOMJLBjrEiKB8F5BfUL0?e=k4qsSD" },
      { title: "4SP ONEDRIVE",   url: "https://liveconcordia-my.sharepoint.com/?login_hint=info%2E4%40concordia%2Eca&source=waffle" },
      { title: "LOWER THIRDS",url: "https://docs.google.com/spreadsheets/d/16c9DD4OHy1SITcF7lJtH7e49ol6SxN9A_8kBAdCOzsQ/edit?gid=0#gid=0" }
    ];

    // All keys are dark by default, like the vintage phone's keycaps.
    // List indices here that should render as "light" keys instead (rare accents).
    const lightKeyIndices = [];

    const grid = document.getElementById("grid");
    const buttons = [];

    links.forEach((link, i) => {
      const num = i + 1; // 1-9
      const isLight = lightKeyIndices.includes(i);

      const a = document.createElement("a");
      a.className = "nav-button" + (isLight ? " key-light" : "");
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.dataset.index = i;

      const corner = document.createElement("span");
      corner.className = "corner-num";
      corner.textContent = num;

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = link.title;

      a.appendChild(corner);
      a.appendChild(label);
      grid.appendChild(a);
      buttons.push(a);
    });

    // --- Keyboard / keypad navigation ---
    const focusTrap = document.getElementById("focusTrap");

    function reFocus() {
      focusTrap.focus();
    }
    focusTrap.addEventListener("blur", () => {
      setTimeout(reFocus, 0);
    });
    reFocus();

    let currentIndex = -1;

    function setFocused(idx) {
      buttons.forEach(b => b.classList.remove("focused"));
      if (idx >= 0 && idx < buttons.length) {
        currentIndex = idx;
        buttons[idx].classList.add("focused");
      }
    }

    function pressAndGo(idx) {
      const btn = buttons[idx];
      if (!btn) return;
      btn.classList.add("pressed");
      setTimeout(() => btn.classList.remove("pressed"), 120);
      window.open(btn.href, "_blank", "noopener,noreferrer");
    }

    document.addEventListener("keydown", (e) => {
      // BrightSign sends e.keyCode as a lowercase, string-typed property in some firmwares.
      // Coerce defensively so this also works correctly on BrightSign hardware.
      const code = Number(e.keyCode !== undefined ? e.keyCode : e.which);

      // Numpad / number row 1-9 -> keyCode 49-57, numpad 97-105
      let numPressed = null;
      if (code >= 49 && code <= 57) numPressed = code - 48;       // "1".."9"
      if (code >= 97 && code <= 105) numPressed = code - 96;      // numpad 1-9

      if (numPressed !== null) {
        const idx = numPressed - 1;
        if (idx >= 0 && idx < buttons.length) {
          setFocused(idx);
          pressAndGo(idx);
        }
        e.preventDefault();
        return;
      }

      // Arrow key navigation across the 3x3 grid
      const cols = 3;
      let next = currentIndex;

      switch (code) {
        case 37: // left
          next = currentIndex <= 0 ? buttons.length - 1 : currentIndex - 1;
          break;
        case 39: // right
          next = currentIndex >= buttons.length - 1 ? 0 : currentIndex + 1;
          break;
        case 38: // up
          next = currentIndex - cols;
          if (next < 0) next += buttons.length;
          break;
        case 40: // down
          next = currentIndex + cols;
          if (next >= buttons.length) next -= buttons.length;
          break;
        case 13: // enter
          if (currentIndex >= 0) pressAndGo(currentIndex);
          e.preventDefault();
          return;
        default:
          return;
      }

      setFocused(next);
      e.preventDefault();
    });

    // Mouse hover also updates focus state for visual consistency
    buttons.forEach((btn, idx) => {
      btn.addEventListener("mouseenter", () => setFocused(idx));
      btn.addEventListener("click", () => pressAndGo(idx));
    });
  </script>
</body>
</html>
