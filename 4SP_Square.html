<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
  <title>Concordia 4th Space Events — Square</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "gill-sans-nova-condensed", sans-serif;
      background: #111;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }

    /* ── URL entry panel ── */
    #urlPanel {
      position: fixed;
      top: 1.5vmin;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      display: flex;
      gap: 10px;
      width: min(900px, 92vw);
      padding: 12px;
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 10px;
    }
    #urlPanel.hidden { display: none; }
    #urlInput {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 1.2rem;
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #666;
      background: #222;
      color: #fff;
    }
    #urlInput::placeholder { color: #888; }
    .panel-btn {
      font-family: inherit;
      font-size: 1.2rem;
      padding: 8px 18px;
      border-radius: 8px;
      border: none;
      color: #fff;
      cursor: pointer;
      white-space: nowrap;
    }
    #loadBtn { background: #912338; }
    #loadBtn:hover { background: #b02b45; }
    #allBtn { background: rgba(255,255,255,0.2); }
    #allBtn:hover { background: rgba(255,255,255,0.4); }
    #statusMsg {
      position: fixed;
      top: calc(1.5vmin + 70px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 10000;
      color: #ccc;
      font-size: 1.1rem;
      text-align: center;
      max-width: 90vw;
    }
    #statusMsg.error { color: #ff8a8a; }

    /* ── zoom controls ── */
    #zoom-controls {
      position: fixed;
      bottom: 1.5vmin;
      right: 1.5vmin;
      z-index: 9999;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 1vmin;
      max-width: calc(100vw - 3vmin);
    }

    .zoom-button {
      font-size: clamp(0.9rem, 3.5vmin, 2rem);
      color: white;
      background: rgba(255,255,255,0.2);
      border: none;
      border-radius: clamp(4px, 1vmin, 8px);
      width:  clamp(32px, 6vmin, 50px);
      height: clamp(32px, 6vmin, 50px);
      cursor: pointer;
      line-height: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }
    .zoom-button:hover  { background: rgba(255,255,255,0.4); }
    .zoom-button:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── square container — fixed 1080×1080, JS scales to fit smaller viewport dimension ── */
    .event-container {
      position: relative;
      width:  1080px;
      height: 1080px;
      flex-shrink: 0;
      overflow: hidden;
      transform-origin: center center;
    }

    .border-overlay {
      position: absolute;
      inset: 0;
      border: 6px solid white;
      z-index: 1000;
      pointer-events: none;
    }

    .zoom-content {
      position: absolute;
      top: 6px; left: 6px;
      width:  calc(100% - 12px);
      height: calc(100% - 12px);
      overflow: hidden;
    }

    /* ── individual event slide ── */
    .event {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      opacity: 0;
      z-index: 0;
      transition: opacity 2s ease-in-out;
    }
    .event.visible { opacity: 1; z-index: 1; }

    .event::before {
      content: "";
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }

    /* ── text overlay — anchored to bottom-left, same proportional padding as original ── */
    .event-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      transform-origin: 5.2% 44.4%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      /* 5.2% of 1080 ≈ 56px left; 9.3% of 1080 ≈ 100px bottom */
      padding-left: 5.2%;
      padding-bottom: 9.3%;
      padding-right: 5.2%;
      gap: 1rem;
    }

    .event-date {
      max-width: 78%;
      font-size: 1.85rem;
      font-weight: 100;
      font-style: italic;
      line-height: 1;
      opacity: 0.9;
      color: #ccc;
      letter-spacing: 0.02em;
    }

    .event-title {
      max-width: 78%;
      font-size: 6.5rem;
      font-weight: bold;
      line-height: 1;
      color: #ccc;
      word-break: keep-all;
      overflow-wrap: break-word;
    }

    .event-description {
      max-width: 78%;
      font-size: 2.6rem;
      line-height: 1;
      opacity: 0.9;
      color: #ccc;
    }

    .event-time {
      max-width: 78%;
      font-size: 1.85rem;
      font-style: italic;
      font-weight: 100;
      line-height: 1.2;
      opacity: 0.8;
      color: #ccc;
      letter-spacing: 0.02em;
    }

    /* ── clock — same position but in square space ── */
    #clock {
      position: absolute;
      top: 9%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 5rem;
      color: #ccc;
      z-index: 9999;
      font-family: "gill-sans-nova-condensed", sans-serif;
      font-weight: lighter;
      white-space: nowrap;
    }

    #loadingSpinner {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 2rem;
      font-family: sans-serif;
      z-index: 10001;
    }

    .emoji-eye {
      display: inline-block;
      width: 1em; height: auto;
      vertical-align: middle;
      object-fit: contain;
      line-height: 1;
    }

    .no-break-look {
      white-space: nowrap !important;
      display: inline-block;
      word-break: keep-all;
      overflow-wrap: normal;
    }
  </style>
</head>
<body>

  <div id="urlPanel" class="hidden">
    <input id="urlInput" type="url" spellcheck="false" autocomplete="off"
           placeholder="Paste event URL, e.g. https://www.concordia.ca/cuevents/offices/provost/fourth-space/2026/12/10/safe-or-secure.html" />
    <button id="loadBtn" class="panel-btn" type="button">Load</button>
    <button id="allBtn" class="panel-btn" type="button" title="Back to the rotating list of all events">All events</button>
  </div>
  <div id="statusMsg"></div>

  <div id="loadingSpinner">Loading events…</div>

  <div class="event-container" id="eventContainer">
    <div class="border-overlay"></div>
    <div id="clock"></div>
    <div class="zoom-content" id="zoomContent"></div>
  </div>

  <div id="zoom-controls">
    <button class="zoom-button" onclick="togglePanel()"              title="Select an event by URL">✎</button>
    <button class="zoom-button" onclick="location.reload()"          title="Reload">←</button>
    <button class="zoom-button" onclick="nextEvent()"                title="Next event">→</button>
    <button class="zoom-button" onclick="changeZoom(-0.1)"           title="Zoom out">−</button>
    <button class="zoom-button" onclick="changeZoom(0.1)"            title="Zoom in">+</button>
    <button class="zoom-button" id="linkBtn" onclick="openCurrentEventLink()" title="Open event page">∗</button>
    <button class="zoom-button" id="saveBtn" onclick="saveAsPng()"   title="Save as PNG">⬇</button>
    <button class="zoom-button" id="wrapBtn" onclick="cycleTitleWidth()" title="Cycle title width">↵</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <script>
    /* CORS fallbacks, tried in order if a direct fetch of an event page is blocked.
       These are third-party services; remove or replace with your own proxy if you prefer. */
    const CORS_PROXIES = [
      u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
      u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u)
    ];

    /* ─────────────────────────────────────────────
       Scale the 1080×1080 container to fill the
       viewport without distortion. The container is
       always square — whichever viewport dimension
       is smaller determines the scale.
    ───────────────────────────────────────────── */
    function fitContainer() {
      const c = document.getElementById('eventContainer');
      const side = Math.min(window.innerWidth, window.innerHeight);
      const scale = side / 1080;
      c.style.transform = `scale(${scale})`;
    }
    fitContainer();
    window.addEventListener('resize', fitContainer);

    /* ─────────────────────────────────────────────
       State
    ───────────────────────────────────────────── */
    let zoomLevel = 1;
    let currentEventIndex = 0;
    let allEvents = [];
    let singleMode = false;   // true while a URL-selected event is showing

    const urlPanel  = document.getElementById('urlPanel');
    const urlInput  = document.getElementById('urlInput');
    const statusMsg = document.getElementById('statusMsg');
    const spinner   = document.getElementById('loadingSpinner');

    function setStatus(msg, isError) {
      statusMsg.textContent = msg || '';
      statusMsg.className = isError ? 'error' : '';
    }

    function togglePanel(forceShow) {
      const show = (typeof forceShow === 'boolean') ? forceShow : urlPanel.classList.contains('hidden');
      urlPanel.classList.toggle('hidden', !show);
      if (!show) setStatus('');
      if (show) { urlInput.focus(); urlInput.select(); }
    }

    /* ─────────────────────────────────────────────
       Overlay text zoom (independent of container scale)
    ───────────────────────────────────────────── */
    function changeZoom(delta) {
      zoomLevel = Math.min(Math.max(zoomLevel + delta, 0.5), 2);
      document.querySelectorAll('.event-overlay').forEach(o => {
        o.style.transform = `scale(${zoomLevel})`;
      });
    }

    /* ─────────────────────────────────────────────
       Navigation
    ───────────────────────────────────────────── */
    function nextEvent() {
      if (!allEvents.length) return;
      allEvents[currentEventIndex].classList.remove('visible');
      currentEventIndex = (currentEventIndex + 1) % allEvents.length;
      allEvents[currentEventIndex].classList.add('visible');
      updateLinkButton();
    }

    function previousEvent() {
      if (!allEvents.length) return;
      allEvents[currentEventIndex].classList.remove('visible');
      currentEventIndex = (currentEventIndex - 1 + allEvents.length) % allEvents.length;
      allEvents[currentEventIndex].classList.add('visible');
      updateLinkButton();
    }

    function openCurrentEventLink() {
      const url = allEvents[currentEventIndex]?.dataset?.link;
      if (url) window.open(url, '_blank');
    }

    function updateLinkButton() {
      const btn = document.getElementById('linkBtn');
      const url = allEvents[currentEventIndex]?.dataset?.link;
      btn.disabled = !url;
      btn.title = url ? `Open: ${url}` : 'No link';
    }

    /* ─────────────────────────────────────────────
       Title max-width cycling
    ───────────────────────────────────────────── */
    const widthPresets = [
      { label: '78%', value: '78%' },
      { label: '55%', value: '55%' },
      { label: '40%', value: '40%' },
      { label: '95%', value: '95%' },
    ];
    let widthIndex = 0;

    function cycleTitleWidth() {
      widthIndex = (widthIndex + 1) % widthPresets.length;
      const { value, label } = widthPresets[widthIndex];
      document.querySelectorAll('.event-title').forEach(t => {
        t.style.maxWidth = value;
      });
      const btn = document.getElementById('wrapBtn');
      btn.title = `Title width: ${label} (click to cycle)`;
    }

    /* Keyboard / Logitech remote */
    document.addEventListener('keydown', e => {
      if (e.target === urlInput) {
        if (e.key === 'Enter') { e.preventDefault(); loadFromInput(); }
        return;   // let arrow keys etc. work normally inside the input
      }
      if      (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); nextEvent(); }
      else if (e.key === 'ArrowLeft'  || e.key === 'PageUp')   { e.preventDefault(); location.reload(); }
    });

    /* ─────────────────────────────────────────────
       Helpers
    ───────────────────────────────────────────── */
    function parseEventTime(timeString) {
      try {
        const m = timeString.match(/(\w+)\s+(\d{1,2}),\s+(\d{4})/);
        if (!m) return { date: null, startTimeStr: '' };
        const monthMap = {January:0,February:1,March:2,April:3,May:4,June:5,
                          July:6,August:7,September:8,October:9,November:10,December:11};
        const date = new Date(parseInt(m[3]), monthMap[m[1]], parseInt(m[2]));

        /* Extract the first time token, e.g. "3 p.m." or "10:30 a.m." */
        const timeMatch = timeString.match(/\d{1,2}(?::\d{2})?\s*[ap]\.m\./i);
        const startTimeStr = timeMatch ? timeMatch[0].replace(/\s+/g, '\u00A0') : '';

        return { date, startTimeStr };
      } catch { return { date: null, startTimeStr: '' }; }
    }

    function processTitleWithEyes(title) {
      const eyeImg = '<img src="https://raw.githubusercontent.com/CU4thSpace/EVENTS/main/emoji-eyes.png" alt="👀" class="emoji-eye">';
      return title
        .replace(/L👀[kK]:/g, m => `<span class="no-break-look">L${eyeImg}${m.slice(-2)}</span>`)
        .replace(/L👀[kK]/g,  m => `<span class="no-break-look">L${eyeImg}${m.slice(-1)}</span>`)
        .replace(/:\s+/g, ':<br>');
    }

    /* ─────────────────────────────────────────────
       Slide builder — shared by RSS rotation and
       URL-selected single event
    ───────────────────────────────────────────── */
    function buildSlide({ title, eventDate, startTimeStr, descHeading, imageUrl, link }) {
      const eventDiv = document.createElement('div');
      eventDiv.className = 'event';
      eventDiv.style.backgroundImage = `url("${imageUrl}")`;
      if (link) eventDiv.dataset.link = link;

      const overlay = document.createElement('div');
      overlay.className = 'event-overlay';

      if (eventDate) {
        const dateDiv = document.createElement('div');
        dateDiv.className = 'event-date';
        const dateLabel = eventDate.toLocaleDateString('en-US', {weekday:'long',month:'long',day:'numeric'});
        dateDiv.textContent = startTimeStr ? `${dateLabel}  ${startTimeStr}` : dateLabel;
        overlay.appendChild(dateDiv);
      }

      const titleDiv = document.createElement('div');
      titleDiv.className = 'event-title';
      titleDiv.innerHTML = processTitleWithEyes(title);
      titleDiv.style.maxWidth = widthPresets[widthIndex].value;
      /* Shrink very long titles */
      if (title.length > 25) {
        const s = Math.max(0.7, 25 / title.length);
        titleDiv.style.fontSize = `${6.5 * s}rem`;
      }
      overlay.appendChild(titleDiv);

      if (descHeading) {
        const descDiv = document.createElement('div');
        descDiv.className = 'event-description';
        descDiv.textContent = descHeading;
        overlay.appendChild(descDiv);
      }

      overlay.style.transform = `scale(${zoomLevel})`;
      eventDiv.appendChild(overlay);
      return eventDiv;
    }

    function preloadImage(url) {
      return new Promise(res => {
        const img = new Image();
        img.onload = img.onerror = res;
        img.src = url;
      });
    }

    /* ─────────────────────────────────────────────
       Fetch & render — RSS rotation
    ───────────────────────────────────────────── */
    async function fetchAndDisplayEvents() {
      if (singleMode) return;   // don't overwrite a URL-selected event

      const response = await fetch(
        'https://www.concordia.ca/content/concordia/en/next-gen/4th-space/programming/RSSCAL/_jcr_content/content-main/grid_container_671899525/grid-container-parsys/events_list.xml',
        { cache: 'no-store' }
      );
      const text = await response.text();
      if (singleMode) return;   // user picked an event while this was in flight

      const xml  = new DOMParser().parseFromString(text, 'application/xml');
      const items = Array.from(xml.querySelectorAll('item'));

      const zoomContent = document.getElementById('zoomContent');
      zoomContent.innerHTML = '';

      const imagePromises = [];
      const eventDivs = [];

      items.forEach(item => {
        const title = item.querySelector('title')?.textContent || 'Untitled';
        const descRaw = item.querySelector('description')?.textContent || '';

        let itemLink = item.querySelector('link')?.textContent?.trim()
                    || item.querySelector('guid')?.textContent?.trim()
                    || '';

        const tmp = document.createElement('div');
        tmp.innerHTML = descRaw;
        const imgEl = tmp.querySelector('img');
        const imageUrl = imgEl ? imgEl.src : 'https://via.placeholder.com/300';

        const descHeading = tmp.querySelector('h2')?.textContent?.trim() || '';
        const descTime    =
