<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Event Scenario Formatter</title>
<style>
  :root {
    --bg: #17181c;
    --panel: #1f2127;
    --border: #33363f;
    --text: #e8e9ec;
    --muted: #9a9da6;
    --accent: #5fb0ff;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 900px; }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 24px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .field { margin-bottom: 12px; }
  .field.full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--accent);
    margin-bottom: 4px;
  }
  label .hint {
    text-transform: none;
    font-weight: 400;
    color: var(--muted);
    letter-spacing: normal;
    margin-left: 6px;
  }
  input[type="text"], textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px 10px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 64px; line-height: 1.4; }
  .section-title {
    margin-top: 24px;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    padding-bottom: 4px;
  }
  .output-box {
    margin-top: 28px;
  }
  #output {
    width: 100%;
    min-height: 380px;
    background: #0e0f12;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 14px;
    font-family: "SFMono-Regular", Consolas, Menlo, monospace;
    font-size: 13px;
    white-space: pre-wrap;
  }
  .btnrow {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  button {
    background: var(--accent);
    color: #0e0f12;
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
  #copyStatus {
    font-size: 12px;
    color: var(--muted);
    align-self: center;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Event Scenario Formatter</h1>
  <div class="sub">Fill in the fields — the formatted version updates live at the bottom for copy/paste into notes.</div>

  <div class="section-title">Scenario</div>
  <div class="grid">
    <div class="field">
      <label>Day / Date</label>
      <input type="text" id="date" placeholder="Thursday, July 30, 2026">
    </div>
    <div class="field">
      <label>Time</label>
      <input type="text" id="time" placeholder="10am - 6pm">
    </div>
    <div class="field">
      <label>Format</label>
      <input type="text" id="format" placeholder="Workshop">
    </div>
    <div class="field">
      <label>Layout</label>
      <input type="text" id="layout" placeholder="Podcast Zone @ Main. 5 Quick Tables...">
    </div>
    <div class="field">
      <label>Cameras</label>
      <input type="text" id="cameras" placeholder="group may use our gear...">
    </div>
    <div class="field">
      <label>Mics</label>
      <input type="text" id="mics" placeholder="probably not needed...">
    </div>
    <div class="field">
      <label>Lower Thirds</label>
      <input type="text" id="lowerThirds" placeholder="N/A">
    </div>
    <div class="field">
      <label>Catering</label>
      <input type="text" id="catering" placeholder="maybe">
    </div>
    <div class="field">
      <label>Dish Project</label>
      <input type="text" id="dishProject" placeholder="YES / NO">
    </div>
  </div>

  <div class="section-title">Notes (one item per line — bullets added automatically)</div>
  <div class="field full">
    <label>Notes <span class="hint">e.g. Organizer, Moderator, Panelists, PPTs</span></label>
    <textarea id="notes" placeholder="Organizer: David Secko, Cristina Sanza, Projected Futures
Moderator / Facilitator: Dave
Panelists / Presenters: n/a
PPTs / Visuals: no"></textarea>
  </div>

  <div class="section-title">Order of Operations</div>
  <div class="grid">
    <div class="field full">
      <label>Header line <span class="hint">e.g. IN PERSON ONLY Event 9-6</span></label>
      <input type="text" id="oooHeader" placeholder="IN PERSON ONLY Event 9 -6">
    </div>
    <div class="field full">
      <label>Steps <span class="hint">one per line — bullets added automatically</span></label>
      <textarea id="oooSteps" placeholder="4SP Intro, handoff to Dave
Open Workshop"></textarea>
    </div>
  </div>

  <div class="section-title">Meeting Notes (one item per line — bullets added automatically)</div>
  <div class="field full">
    <textarea id="meetingNotes" placeholder="Talk to Dave about Voltage collab...
@Douglas Moffat check in on this in January..."></textarea>
  </div>

  <div class="output-box">
    <div class="section-title" style="margin-top:0;">Formatted Output</div>
    <textarea id="output" readonly></textarea>
    <div class="btnrow">
      <button onclick="copyOutput()">Copy to Clipboard</button>
      <button class="secondary" onclick="clearAll()">Clear All</button>
      <span id="copyStatus"></span>
    </div>
  </div>
</div>

<script>
const ids = ['date','time','format','layout','cameras','mics','lowerThirds','catering','dishProject','notes','oooHeader','oooSteps','meetingNotes'];

function bulletize(text) {
  return text
    .split('\n')
    .map(l => l.trim())
    .filter(l => l.length > 0)
    .map(l => '* ' + l)
    .join('\n');
}

function buildOutput() {
  const v = {};
  ids.forEach(id => v[id] = document.getElementById(id).value);

  const notesBlock = bulletize(v.notes);
  const oooStepsBlock = bulletize(v.oooSteps);
  const meetingNotesBlock = bulletize(v.meetingNotes);

  const out =
`SCENARIO
${v.date}
${v.time}
FORMAT: ${v.format}
LAYOUT: ${v.layout}
CAMERAS: ${v.cameras}
MICS: ${v.mics}
LOWER THIRDS: ${v.lowerThirds}
CATERING: ${v.catering}
DISH PROJECT: ${v.dishProject}
NOTES:

${notesBlock}

ORDER OF OPERATIONS
${v.oooHeader}

${oooStepsBlock}

-----------------------------------------------------------------------------------------------------------------

MEETING NOTES:

${meetingNotesBlock}`;

  document.getElementById('output').value = out;
}

ids.forEach(id => {
  document.getElementById(id).addEventListener('input', buildOutput);
});

function copyOutput() {
  const out = document.getElementById('output');
  out.select();
  document.execCommand('copy');
  const status = document.getElementById('copyStatus');
  status.textContent = 'Copied!';
  setTimeout(() => status.textContent = '', 1500);
}

function clearAll() {
  ids.forEach(id => document.getElementById(id).value = '');
  buildOutput();
}

buildOutput();
</script>
</body>
</html>
