<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4TH SPACE — Event Credits Feed</title>
<link rel="stylesheet" href="https://use.typekit.net/paf7uxj.css">
<style>
  :root{
    --bg:#111;
    --card:#1a1a1a;
    --line:#333;
    --ink:#ccc;
    --ink-dim:#888;
    --white:#fff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:"gill-sans-nova-condensed", sans-serif;
  }
  header{
    padding:3rem 1.5rem 2rem;
    border-bottom:1px solid var(--line);
  }
  header .kicker{
    text-transform:uppercase;
    letter-spacing:.3em;
    font-size:.85rem;
    color:var(--ink-dim);
    margin:0 0 .5rem;
    font-weight:700;
  }
  header h1{
    margin:0;
    font-size:clamp(2.6rem, 7vw, 5rem);
    font-weight:700;
    line-height:0.9;
    color:var(--ink);
    opacity:.95;
    text-transform:uppercase;
  }
  header p.sub{
    font-size:1.15rem;
    color:var(--ink-dim);
    max-width:640px;
    margin:1rem 0 0;
    line-height:1.3;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:2rem 1.5rem 4rem;
  }
  .toolbar{
    display:flex;
    gap:.6rem;
    flex-wrap:wrap;
    margin-bottom:2rem;
  }
  .toolbar input{
    flex:1;
    min-width:200px;
    padding:.8rem 1rem;
    border:1px solid var(--line);
    background:var(--card);
    color:var(--ink);
    font-family:inherit;
    font-size:1.1rem;
    border-radius:2px;
  }
  .toolbar input::placeholder{ color:var(--ink-dim); }
  .count{
    font-size:.85rem;
    color:var(--ink-dim);
    align-self:center;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:.08em;
  }
  .grid{
    display:grid;
    grid-template-columns:1fr;
    gap:1.6rem;
  }
  .event{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:3px;
    overflow:hidden;
  }
  .event-banner{
    position:relative;
    width:100%;
    aspect-ratio:16/8;
    background-size:cover;
    background-position:center;
    background-color:#050505;
    display:flex;
    align-items:flex-end;
  }
  .event-banner::before{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.55) 40%, rgba(0,0,0,.15) 75%, rgba(0,0,0,0) 100%);
  }
  .event.no-image .event-banner{
    background-color:#050505;
    aspect-ratio:16/4;
  }
  .banner-text{
    position:relative;
    z-index:1;
    padding:1.4rem 1.6rem 1.2rem;
    width:100%;
  }
  .event-title{
    margin:0;
    font-size:clamp(1.7rem, 4vw, 3.2rem);
    font-weight:700;
    line-height:0.92;
    color:var(--ink);
    opacity:.95;
    text-transform:uppercase;
  }
  .event-title a{
    color:inherit;
    text-decoration:none;
  }
  .event-title a:hover{ color:var(--white); }
  .event-date{
    font-size:1.05rem;
    color:var(--ink-dim);
    margin:.3rem 0 0;
    letter-spacing:.03em;
  }
  .credit-block{
    padding:1.3rem 1.6rem 1.5rem;
  }
  .credit-label{
    font-size:.85rem;
    text-transform:uppercase;
    letter-spacing:.2em;
    color:var(--ink-dim);
    font-weight:700;
    margin:0 0 .3rem;
  }
  .credit-value{
    margin:0 0 .9rem;
    font-size:1.15rem;
    color:var(--ink);
    line-height:1.25;
  }
  .credit-value a{ color:var(--white); text-decoration:underline; }
  ul.speaker-list{
    margin:.2rem 0 .9rem;
    padding-left:1.2rem;
    columns:2;
    -webkit-columns:2;
    font-size:1.1rem;
    color:var(--ink);
  }
  ul.speaker-list li{ break-inside:avoid; margin-bottom:.2rem; }
  .empty-note{
    font-size:1.05rem;
    color:var(--ink-dim);
    font-style:italic;
    margin:0;
  }
  footer{
    text-align:center;
    font-size:.8rem;
    color:var(--ink-dim);
    padding:2rem 1.5rem 3rem;
    border-top:1px solid var(--line);
  }
  .status{ font-size:1.1rem; color:var(--ink-dim); padding:1rem 0; }
  .error-box{
    background:#241010;
    border:1px solid #5a2a2a;
    border-left:4px solid #b23a3a;
    padding:1.2rem 1.4rem;
    margin-bottom:1.5rem;
    font-size:1rem;
    color:#f2c9c9;
    border-radius:2px;
  }
  .error-box strong{ display:block; margin-bottom:.4rem; font-size:1.1rem; }
  .error-box code{ background:#000; padding:.1rem .35rem; border-radius:2px; }
  .spinner{
    display:inline-block;width:14px;height:14px;border:2px solid var(--line);
    border-top-color:var(--ink);border-radius:50%;animation:spin 0.8s linear infinite;
    margin-right:.5rem;vertical-align:middle;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (min-width:760px){
    .grid{ grid-template-columns:1fr 1fr; }
  }
  @media (max-width:520px){
    ul.speaker-list{ columns:1; }
  }
</style>
</head>
<body>

<header>
  <p class="kicker">4TH SPACE · Concordia University</p>
  <h1>Event Credits Feed</h1>
  <p class="sub">Organizers, participants, and speakers pulled from each event's page — fetched live, not part of the public RSS feed.</p>
</header>

<main>
  <div class="toolbar">
    <input type="text" id="searchBox" placeholder="Filter by name, org, or event title…" onkeyup="filterEvents()" disabled>
    <span class="count" id="countLabel"></span>
  </div>

  <div id="status" class="status"><span class="spinner"></span> Fetching RSS feed…</div>
  <div id="eventList" class="grid"></div>
</main>

<footer>
  Fetched live from concordia.ca on page load.
</footer>

<script>
const RSS_URL = "https://www.concordia.ca/content/concordia/en/next-gen/4th-space/programming/RSSCAL/_jcr_content/content-main/grid_container_671899525/grid-container-parsys/events_list.xml";
const CONCURRENCY = 4;

function showError(title, detail){
  const status = document.getElementById('status');
  status.innerHTML = '';
  const box = document.createElement('div');
  box.className = 'error-box';
  box.innerHTML = `<strong>${title}</strong>${detail}`;
  status.appendChild(box);
}

function cleanText(str){
  return str.replace(/\s+/g, ' ').trim();
}

async function fetchText(url){
  const resp = await fetch(url, { credentials: 'omit' });
  if(!resp.ok) throw new Error(`HTTP ${resp.status} for ${url}`);
  return await resp.text();
}

async function getFeedItems(){
  const xmlText = await fetchText(RSS_URL);
  const xml = new DOMParser().parseFromString(xmlText, 'application/xml');
  const parseError = xml.querySelector('parsererror');
  if(parseError) throw new Error('RSS feed did not parse as valid XML.');
  const items = [...xml.querySelectorAll('item')].map(item => ({
    title: cleanText(item.querySelector('title')?.textContent || ''),
    link: (item.querySelector('link')?.textContent || '').trim().replace(/^http:/, 'https:'),
    pubDate: (item.querySelector('pubDate')?.textContent || '').trim()
  })).filter(i => i.link);
  return items;
}

function formatDate(pubDate){
  const d = new Date(pubDate);
  if(isNaN(d)) return pubDate;
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}

function extractThumbnail(doc, pageUrl){
  const og = doc.querySelector('meta[property="og:image"]');
  if(og && og.content){
    try { return new URL(og.content, pageUrl).href; } catch(e){ return og.content; }
  }
  const mainImg = doc.querySelector('#parsys_main_image img, .c-image img');
  if(mainImg && mainImg.getAttribute('src')){
    try { return new URL(mainImg.getAttribute('src'), pageUrl).href; } catch(e){ return null; }
  }
  return null;
}

/* Same three credit patterns as before: accordion, italic line, Speakers heading. */
function extractCredits(pageHtml, pageUrl){
  const doc = new DOMParser().parseFromString(pageHtml, 'text/html');
  const result = {
    organizedBy: null, withSupport: null, participants: [], speakers: [],
    description: null, hasCredits: false, thumbnail: extractThumbnail(doc, pageUrl)
  };

  let accordionBody = null;
  doc.querySelectorAll('.accordion-header').forEach(header => {
    if(accordionBody) return;
    if(cleanText(header.textContent).toUpperCase().startsWith('CREDIT')){
      const item = header.closest('.accordion-item');
      accordionBody = item ? item.querySelector('.accordion-body') : null;
    }
  });

  if(accordionBody){
    const rte = accordionBody.querySelector('.rte') || accordionBody;
    const children = [...rte.children].filter(c => ['P','UL'].includes(c.tagName));
    const labelMap = { 'description':'description', 'organized by':'organizedBy', 'participants':'participants', 'with':'withSupport' };
    for(let i=0;i<children.length;i++){
      const el = children[i];
      if(el.tagName !== 'P') continue;
      const b = el.querySelector('b');
      if(!b) continue;
      const label = cleanText(b.textContent).replace(/:$/,'').toLowerCase();
      const key = labelMap[label];
      if(!key) continue;
      result.hasCredits = true;
      const clone = el.cloneNode(true);
      const bClone = clone.querySelector('b');
      if(bClone) bClone.remove();
      const remainderHtml = clone.innerHTML.trim();
      const remainderText = cleanText(clone.textContent);
      const next = children[i+1];
      if(key === 'participants'){
        if(next && next.tagName === 'UL'){
          result.participants = [...next.querySelectorAll('li')].map(li => cleanText(li.textContent));
          i++;
        }
      } else if(key === 'withSupport'){
        if(next && next.tagName === 'UL'){
          result.withSupport = [...next.querySelectorAll('li')].map(li => cleanText(li.textContent)).join('; ');
          i++;
        } else if(remainderText){
          result.withSupport = remainderHtml;
        }
      } else if(key === 'organizedBy'){
        if(next && next.tagName === 'UL'){
          result.organizedBy = [...next.querySelectorAll('li')].map(li => cleanText(li.textContent)).join('; ');
          i++;
        } else if(remainderText){
          result.organizedBy = remainderHtml;
        }
      } else if(key === 'description' && remainderText){
        result.description = remainderText;
      }
    }
  }

  if(!result.organizedBy){
    doc.querySelectorAll('h5, h6, p').forEach(tag => {
      const txt = cleanText(tag.textContent);
      if(/^(organized by|organis[ée] par)/i.test(txt)){
        result.organizedBy = tag.innerHTML.trim();
        result.hasCredits = true;
      } else if(/^with\b/i.test(txt) && !/conversation/i.test(txt)){
        result.withSupport = tag.innerHTML.trim();
        result.hasCredits = true;
      }
    });
  }

  doc.querySelectorAll('h2, h3').forEach(heading => {
    const htxt = cleanText(heading.textContent).toLowerCase();
    if(['speakers','speaker','panelists','panellists'].includes(htxt)){
      let sib = heading.nextElementSibling;
      const names = [];
      while(sib && !['H1','H2','HR'].includes(sib.tagName)){
        if(['H3','H4'].includes(sib.tagName)){
          const name = cleanText(sib.textContent);
          if(name) names.push(name);
        }
        sib = sib.nextElementSibling;
      }
      if(names.length){ result.speakers = names; result.hasCredits = true; }
    }
  });

  return result;
}

function renderEvent(item, credits){
  const article = document.createElement('article');
  article.className = credits.hasCredits ? 'event' : 'event no-credits';
  if(!credits.thumbnail) article.classList.add('no-image');
  const searchBlob = [item.title, credits.organizedBy || '', ...(credits.speakers||[]), ...(credits.participants||[])]
    .join(' ').replace(/<[^>]+>/g, ' ').toLowerCase();
  article.setAttribute('data-search', searchBlob);

  const bannerStyle = credits.thumbnail ? `style="background-image:url('${credits.thumbnail}')"` : '';

  let inner = `
    <div class="event-banner" ${bannerStyle}>
      <div class="banner-text">
        <h2 class="event-title"><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h2>
        <p class="event-date">${formatDate(item.pubDate)}</p>
      </div>
    </div>
    <div class="credit-block">
  `;
  if(!credits.hasCredits){
    inner += `<p class="empty-note">No credits published on this event page.</p>`;
  } else {
    if(credits.description) inner += `<p class="credit-value">${credits.description}</p>`;
    if(credits.organizedBy) inner += `<p class="credit-label">Organized by</p><p class="credit-value">${credits.organizedBy}</p>`;
    if(credits.withSupport) inner += `<p class="credit-label">With support from</p><p class="credit-value">${credits.withSupport}</p>`;
    if(credits.speakers && credits.speakers.length){
      inner += `<p class="credit-label">Speakers</p><ul class="speaker-list">` +
        credits.speakers.map(n => `<li>${n}</li>`).join('') + `</ul>`;
    }
    if(credits.participants && credits.participants.length){
      inner += `<p class="credit-label">Participants</p><ul class="speaker-list">` +
        credits.participants.map(n => `<li>${n}</li>`).join('') + `</ul>`;
    }
  }
  inner += `</div>`;
  article.innerHTML = inner;
  return article;
}

function filterEvents(){
  const q = document.getElementById('searchBox').value.toLowerCase();
  const events = document.querySelectorAll('.event');
  let shown = 0;
  events.forEach(ev => {
    const match = ev.getAttribute('data-search').includes(q);
    ev.style.display = match ? '' : 'none';
    if(match) shown++;
  });
  document.getElementById('countLabel').textContent = shown + ' of ' + events.length + ' events';
}

async function mapWithConcurrency(items, limit, fn){
  const results = new Array(items.length);
  let idx = 0;
  async function worker(){
    while(idx < items.length){
      const current = idx++;
      results[current] = await fn(items[current], current);
    }
  }
  await Promise.all(new Array(limit).fill(0).map(worker));
  return results;
}

async function main(){
  const status = document.getElementById('status');
  const list = document.getElementById('eventList');

  let feedItems;
  try{
    feedItems = await getFeedItems();
  } catch(err){
    showError(
      'Could not load the RSS feed from the browser.',
      `<p>concordia.ca likely isn't sending CORS headers that allow this page's origin to read the response.</p>
       <p>Error detail: <code>${err.message}</code></p>`
    );
    return;
  }

  status.innerHTML = `<span class="spinner"></span> Loaded ${feedItems.length} events. Fetching credits from each page…`;

  let failCount = 0;
  const rendered = await mapWithConcurrency(feedItems, CONCURRENCY, async (item) => {
    try {
      const pageHtml = await fetchText(item.link);
      const credits = extractCredits(pageHtml, item.link);
      return renderEvent(item, credits);
    } catch(err){
      failCount++;
      const article = document.createElement('article');
      article.className = 'event no-credits no-image';
      article.setAttribute('data-search', item.title.toLowerCase());
      article.innerHTML = `
        <div class="event-banner">
          <div class="banner-text">
            <h2 class="event-title"><a href="${item.link}" target="_blank" rel="noopener">${item.title}</a></h2>
            <p class="event-date">${formatDate(item.pubDate)}</p>
          </div>
        </div>
        <div class="credit-block"><p class="empty-note">Couldn't fetch this event page (${err.message}).</p></div>
      `;
      return article;
    }
  });

  rendered.forEach(article => list.appendChild(article));

  if(failCount === feedItems.length){
    showError(
      'RSS loaded, but every individual event page failed to fetch.',
      `<p>This is the CORS pattern you'd expect if concordia.ca allows the RSS/XML endpoint to be read cross-origin but not the regular HTML event pages.</p>`
    );
  } else {
    status.remove();
  }

  document.getElementById('searchBox').disabled = false;
  filterEvents();
}

main();
</script>

</body>
</html>
